[package]
name = "blinkcms-datarouter"
version = "0.2.0"
edition = "2024"
license = "Proprietary"
description = "BlinkCMS local shared-memory datarouter C ABI packaged for Cargo"
readme = "README.md"
repository = "https://github.com/Creeper23456/blinkcms"
links = "datarouter"
build = "build.rs"
include = [
    "Cargo.toml",
    "README.md",
    "build.rs",
    "include/datarouter.h",
    "include/datarouter_frontend.h",
    "include/datarouter_frontend.hpp",
    "include/datarouter_protocol.h",
    "src/lib.rs",
    "src/logging.rs",
    "src/frontend.rs",
    "src/frontend/*.rs",
    "src/switch_frontend.rs",
    "src/protocol.rs",
    "src/query/*.rs",
    "src/protocol_ffi.rs",
    "src/common.c",
    "src/datarouter_internal.h",
    "src/datarouter_registry.h",
    "src/datarouter_router.h",
    "src/datarouter_scheduler.h",
    "src/datarouter_signal.h",
    "src/config.h",
    "src/config.c",
    "src/switch.c",
    "src/platform_linux.c",
    "src/platform_windows.c",
    "src/port.c",
    "src/registry.c",
    "src/router.c",
    "src/ring.c",
    "src/scheduler.c",
    "src/signal.c",
    "src/validation.c",
    "src/validation.rs",
    "docs/*.md",
]

[features]
# 缺省开启：直接指针数据面（direct data plane）。绕过 switch 的数据路由，发送端
# 把帧直接写进目标 RX ring（像 port.c 一样对共享内存做指针操作），全链路拷贝降到
# 2 次（app -> 目标 RX ring，RX ring -> app buffer）。switch 仅保留控制面
# （注册/注销/TTL/死进程回收）。
# 旧拷贝模式（safe mode，switch 路由 4 次拷贝）保留，用 `--no-default-features`
# 构建即回到该模式，供兼容/回滚。
unsafe = []

default = ["unsafe"]

[dependencies]
libc = "0.2"
tracing = "0.1"

[lib]
name = "blinkcms_datarouter"
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[[test]]
name = "direct_plane_multiprocess"
path = "tests/direct_plane_multiprocess.rs"
harness = false
required-features = ["unsafe"]
