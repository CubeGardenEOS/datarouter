[package]
name = "blinkcms-datarouter"
version = "0.2.0"
edition = "2024"
license = "Proprietary"
description = "BlinkCMS local shared-memory datarouter C ABI packaged for Cargo"
readme = "README.md"
repository = "https://github.com/Creeper23456/blinkcms"
links = "datarouter"
build = "build.rs"
include = [
    "Cargo.toml",
    "README.md",
    "build.rs",
    "include/datarouter.h",
    "include/datarouter_frontend.h",
    "include/datarouter_protocol.h",
    "src/lib.rs",
    "src/logging.rs",
    "src/frontend.rs",
    "src/frontend/*.rs",
    "src/switch_frontend.rs",
    "src/protocol.rs",
    "src/query/*.rs",
    "src/protocol_ffi.rs",
    "src/common.c",
    "src/datarouter_internal.h",
    "src/datarouter_registry.h",
    "src/datarouter_router.h",
    "src/datarouter_scheduler.h",
    "src/datarouter_signal.h",
    "src/config.h",
    "src/config.c",
    "src/switch.c",
    "src/platform_linux.c",
    "src/platform_windows.c",
    "src/port.c",
    "src/registry.c",
    "src/router.c",
    "src/ring.c",
    "src/scheduler.c",
    "src/signal.c",
    "benches/*.rs",
    "docs/*.md",
]

[features]
default = []
# 开发中特性：直接指针数据面。绕过 switch 的数据路由，发送端把帧直接写进
# 目标 RX ring（像 port.c 一样对共享内存做指针操作），全链路拷贝降到 2 次
# （app -> 目标 RX ring，RX ring -> app buffer）。switch 仅保留控制面
# （注册/注销/TTL/死进程回收）。生产构建默认关闭。
unsafe = []

[dependencies]
libc = "0.2"

[lib]
name = "blinkcms_datarouter"
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[[bench]]
name = "protocol_hot_path"
harness = false

[[bench]]
name = "ipc_frontend"
harness = false

[[bench]]
name = "ipc_modes"
harness = false

[[bench]]
name = "ipc_unsafe"
harness = false
required-features = ["unsafe"]
