name: Publish Python Bindings

on:
  workflow_dispatch:
  push:
    tags:
      - "latest"

permissions:
  contents: write

concurrency:
  group: publish-latest
  cancel-in-progress: false

defaults:
  run:
    working-directory: python

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist
      - name: Point latest at the built source
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.git.getRef({...context.repo, ref: 'tags/latest'});
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({...context.repo, ref: 'refs/tags/latest', sha: context.sha});
              return;
            }
            await github.rest.git.updateRef({...context.repo, ref: 'tags/latest', sha: context.sha, force: true});
      - name: Publish replaceable latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: python/dist/*.whl
          overwrite_files: true
          generate_release_notes: false
      - name: Remove superseded wheel assets
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const current = new Set(fs.readdirSync('python/dist').filter(name => name.endsWith('.whl')));
            if (!current.size) throw new Error('No built wheels; refusing asset cleanup');
            const {data: release} = await github.rest.repos.getReleaseByTag({...context.repo, tag: 'latest'});
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo, release_id: release.id, per_page: 100
            });
            for (const name of current) {
              if (!assets.some(asset => asset.name === name && asset.state === 'uploaded')) {
                throw new Error(`Missing uploaded wheel: ${name}`);
              }
            }
            for (const asset of assets) {
              if (asset.name.endsWith('.whl') && !current.has(asset.name)) {
                await github.rest.repos.deleteReleaseAsset({...context.repo, asset_id: asset.id});
              }
            }
